<style>
  :root { --accent:#0056d2; --border:#e4e4e4; --hover:#f0f6ff; --sel:#e1ecff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { display:flex; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:#1f1f1f; background:#fff; }
  #sidebar { width:360px; min-width:360px; height:100vh; display:flex; flex-direction:column; border-right:1px solid var(--border); background:#fbfbfb; z-index:30; }
  #sidebar-head { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
  #course-title { padding:16px; font-size:17px; font-weight:700; color:var(--accent); line-height:1.3; }
  #close-btn { display:none; background:none; border:none; font-size:26px; line-height:1; color:#555; padding:8px 14px; cursor:pointer; }
  #menu-btn { display:none; position:fixed; top:10px; left:10px; z-index:20; width:46px; height:42px; border:none; border-radius:6px; background:var(--accent); color:#fff; font-size:20px; cursor:pointer; }
  #menu-btn:hover { background:#0043a8; }
  #nav { flex:1; overflow-y:auto; padding:6px 0; }
  #next-btn { margin:12px; padding:12px 16px; border:none; border-radius:6px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  #next-btn:hover:not(:disabled) { background:#0043a8; }
  #next-btn:disabled { opacity:.45; cursor:default; }
  .module { margin-bottom:2px; }
  .module > summary, .lesson > summary { list-style:none; cursor:pointer; user-select:none; display:flex; align-items:center; gap:8px; }
  summary::-webkit-details-marker { display:none; }
  .module > summary { padding:12px 16px; font-weight:700; font-size:15px; }
  .module > summary:hover { background:var(--hover); }
  .lesson { margin-left:8px; }
  .lesson > summary { padding:9px 16px 9px 22px; font-weight:600; font-size:14px; color:#333; }
  .lesson > summary:hover { background:var(--hover); }
  .part { display:block; padding:8px 16px 8px 44px; font-size:13.5px; color:#555; text-decoration:none; cursor:pointer; border-left:3px solid transparent; }
  .part:hover { background:var(--hover); color:#1f1f1f; }
  .part.active { background:var(--sel); color:var(--accent); font-weight:600; border-left-color:var(--accent); }
  .chev { transition:transform .15s ease; font-size:10px; color:#888; flex:0 0 auto; }
  details[open] > summary .chev { transform:rotate(90deg); }
  #main { flex:1; height:100vh; }
  #viewer { width:100%; height:100%; border:0; display:block; background:#fff; }
  @media (max-width: 768px) {
    #menu-btn { display:block; }
    #close-btn { display:block; }
    #sidebar { position:fixed; inset:0; width:100%; min-width:0; transform:translateX(-100%); transition:transform .25s ease; }
    #sidebar.open { transform:translateX(0); }
    #main { width:100%; }
  }
</style>

document.getElementById('course-title').textContent = MANIFEST.course;

const nav = document.getElementById('nav');
const main = document.getElementById('main');
const nextBtn = document.getElementById('next-btn');
const sidebar = document.getElementById('sidebar');
const menuBtn = document.getElementById('menu-btn');
const closeBtn = document.getElementById('close-btn');
const flat = [];
let current = -1;

function isMobile() { return window.matchMedia('(max-width: 768px)').matches; }
menuBtn.addEventListener('click', function () { sidebar.classList.add('open'); });
closeBtn.addEventListener('click', function () { sidebar.classList.remove('open'); });

function makePart(part, modTitle, lesTitle) {
  const el = document.createElement('a');
  el.className = 'part';
  el.textContent = part.title;
  el.href = '#';
  const idx = flat.length;
  flat.push({ title: part.title, path: part.path, module: modTitle, lesson: lesTitle, el: el });
  el.addEventListener('click', function (e) { e.preventDefault(); select(idx); });
  return el;
}

MANIFEST.modules.forEach(function (mod) {
  const md = document.createElement('details');
  md.className = 'module';
  const ms = document.createElement('summary');
  ms.innerHTML = '<span class="chev">\u25B6</span><span></span>';
  ms.lastElementChild.textContent = mod.title;
  md.appendChild(ms);

  mod.lessons.forEach(function (les) {
    const ld = document.createElement('details');
    ld.className = 'lesson';
    const ls = document.createElement('summary');
    ls.innerHTML = '<span class="chev">\u25B6</span><span></span>';
    ls.lastElementChild.textContent = les.title;
    ld.appendChild(ls);
    les.parts.forEach(function (p) { ld.appendChild(makePart(p, mod.title, les.title)); });
    md.appendChild(ld);
  });

  nav.appendChild(md);
});

function select(i) {
  if (i < 0 || i >= flat.length) return;
  if (current >= 0 && flat[current]) flat[current].el.classList.remove('active');
  current = i;
  const item = flat[i];
  item.el.classList.add('active');

  let p = item.el.parentElement;
  while (p) { if (p.tagName === 'DETAILS') p.open = true; p = p.parentElement; }
  item.el.scrollIntoView({ block: 'nearest' });

  main.innerHTML = '';
  const f = document.createElement('iframe');
  f.id = 'viewer';
  f.src = encodeURI(item.path);
  main.appendChild(f);

  if (isMobile()) sidebar.classList.remove('open');
  nextBtn.disabled = current >= flat.length - 1;
  try { localStorage.setItem('aiDataLast', String(i)); } catch (e) {}
}

nextBtn.addEventListener('click', function () { select(current + 1); });

document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') select(current + 1);
  else if (e.key === 'ArrowLeft') select(current - 1);
});

let start = 0;
try {
  const v = parseInt(localStorage.getItem('aiDataLast'), 10);
  if (!isNaN(v) && v >= 0 && v < flat.length) start = v;
} catch (e) {}
if (flat.length) select(start);
if (isMobile()) sidebar.classList.add('open');
